# Black Mango release: push a tag like v2.0.0-beta.3 (test build) or v2.0.0 (final) and this
# builds the Windows installer, then the Mac app; packages a .dmg (for people) and a .zip (for
# the Mac updater); signs both updates (Sparkle EdDSA for Mac, WinSparkle DSA for Windows);
# publishes one GitHub Release with everything; and adds both to the update feed on the
# "updates" branch. Tags with a dash (-beta.3) are marked as pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version from the tag
        id: v
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "name=${VER%%-*}" >> "$GITHUB_OUTPUT"

      - name: Build the app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BM_VERSION="${{ steps.v.outputs.ver }}"

      - name: Include the Visual C++ runtime
        shell: bash
        run: |
          # Flutter apps need these three files; most PCs have them, but not all.
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" build/windows/x64/runner/Release/
          done

      - name: Make the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.v.outputs.ver }}" "/DOutputName=Black-Mango-${{ steps.v.outputs.ver }}-Setup" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe

  macos:
    needs: windows
    runs-on: macos-14
    # The signing keys are used in this job. With a protection rule on the "release" environment
    # (repo Settings > Environments), it waits for Chad to approve before it can use them.
    environment: release
    permissions:
      contents: write # publish the release and the update feed
      id-token: write # build attestations (proof the files were built here, from this commit)
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version from the tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NAME="${VER%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build the app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BM_VERSION="${{ steps.v.outputs.ver }}"

      - name: Sign the whole app (free, self-made signature)
        run: |
          # Without a paid Apple account the build's own signature doesn't cover every part of the app,
          # and macOS calls a downloaded copy "damaged". Re-signing the whole bundle fixes that, so
          # people get the normal one-time "Open Anyway" step instead.
          APP="build/macos/Build/Products/Release/Black Mango.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package (.dmg and .zip)
        run: |
          APP="build/macos/Build/Products/Release/Black Mango.app"
          VER="${{ steps.v.outputs.ver }}"
          mkdir -p dist dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Black-Mango-$VER.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Black Mango" -srcfolder dmg -ov -format UDZO "dist/Black-Mango-$VER.dmg"

      - name: Sign the update
        id: sig
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsSL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          SIG=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | ./sparkle/bin/sign_update --ed-key-file - "dist/Black-Mango-${{ steps.v.outputs.ver }}.zip")
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Sign the Windows update
        id: wsig
        env:
          WINSPARKLE_DSA_PRIVATE_KEY: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY }}
        run: |
          if [ -z "$WINSPARKLE_DSA_PRIVATE_KEY" ]; then
            echo "::error::The WINSPARKLE_DSA_PRIVATE_KEY secret is missing (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$WINSPARKLE_DSA_PRIVATE_KEY" > "$RUNNER_TEMP/dsa_priv.pem"
          EXE="dist/Black-Mango-${{ steps.v.outputs.ver }}-Setup.exe"
          SIG=$(openssl dgst -sha1 -binary < "$EXE" | openssl dgst -sha1 -sign "$RUNNER_TEMP/dsa_priv.pem" | openssl enc -base64 -A)
          rm -f "$RUNNER_TEMP/dsa_priv.pem"
          if [ -z "$SIG" ]; then echo "::error::Could not sign the Windows installer."; exit 1; fi
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "len=$(stat -f%z "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Black-Mango-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Proof of where the files were built (build attestations)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/Black-Mango-*'

      - name: Release notes
        run: |
          python3 tool/release_notes.py "${{ steps.v.outputs.tag }}" > dist/notes.md
          {
            echo
            echo "## Checking your download"
            echo
            echo "Each file's SHA-256 is in SHA256SUMS.txt. GitHub can also confirm a file was built by this"
            echo "repository's release workflow from the public code: \`gh attestation verify <file> --repo ${{ github.repository }}\`"
          } >> dist/notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Black Mango ${{ steps.v.outputs.ver }}
          body_path: dist/notes.md
          prerelease: ${{ steps.v.outputs.pre }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Add it to the update feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin updates >/dev/null; then
            git fetch origin updates
            git worktree add feed origin/updates
            git -C feed checkout -B updates
          else
            git worktree add --detach feed
            git -C feed checkout --orphan updates
            git -C feed rm -rfq .
          fi
          NOTES="release-notes/${{ steps.v.outputs.tag }}.md"
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}"
          python3 tool/appcast.py \
            --feed feed/appcast.xml \
            --os macos \
            --version "${{ steps.v.outputs.ver }}" \
            --build "${{ github.run_number }}" \
            --url "$BASE/Black-Mango-${{ steps.v.outputs.ver }}.zip" \
            --signature '${{ steps.sig.outputs.sig }}' \
            --notes "$NOTES"
          python3 tool/appcast.py \
            --feed feed/appcast.xml \
            --os windows \
            --version "${{ steps.v.outputs.ver }}" \
            --build "${{ steps.v.outputs.name }}+${{ github.run_number }}" \
            --url "$BASE/Black-Mango-${{ steps.v.outputs.ver }}-Setup.exe" \
            --dsa-signature "${{ steps.wsig.outputs.sig }}" \
            --length "${{ steps.wsig.outputs.len }}" \
            --notes "$NOTES"
          git -C feed add appcast.xml
          git -C feed commit -m "Update feed: ${{ steps.v.outputs.ver }}"
          git -C feed push origin updates
